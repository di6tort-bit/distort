// Top-level build file
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// NOTE: repositories are declared in settings.gradle (dependencyResolutionManagement)
// Do not add allprojects { repositories { ... } } here — it conflicts with Gradle 8+

name: Build DISTORT Windows .exe
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - name: Install root deps
        run: bun install
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/distort.db"
          SKIP_DB: "true"
      - name: Install desktop deps
        working-directory: desktop
        run: bun install
      - name: Generate icons
        working-directory: desktop
        run: bun run build-icons.mjs
      - name: Download xray-core
        working-directory: desktop
        run: |
          mkdir -p resources/bin
          cd resources/bin
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip
          unzip -o xray.zip
          rm xray.zip
      - name: Build desktop app
        working-directory: desktop
        run: |
          bun run build:desktop
          bunx electron-builder --win nsis portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: DISTORT-Windows-Setup
          path: desktop/release/DISTORT-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DISTORT-Windows-Portable
          path: desktop/release/DISTORT-Portable-*.exe

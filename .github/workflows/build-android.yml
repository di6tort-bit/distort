name: Build DISTORT Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Download xray-core for all Android ABIs
        working-directory: mobile/android/app/src/main/jniLibs
        shell: bash
        run: |
          # arm64-v8a (most modern phones — ~95% of devices)
          mkdir -p arm64-v8a
          curl -fsSL -o /tmp/xray-arm64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o /tmp/xray-arm64.zip -d /tmp/arm64-tmp
          cp /tmp/arm64-tmp/xray arm64-v8a/libxray.so
          chmod +x arm64-v8a/libxray.so
          rm -rf /tmp/arm64-tmp /tmp/xray-arm64.zip

          # x86_64 (emulators)
          mkdir -p x86_64
          curl -fsSL -o /tmp/xray-x86.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-x86_64.zip
          unzip -o /tmp/xray-x86.zip -d /tmp/x86-tmp
          cp /tmp/x86-tmp/xray x86_64/libxray.so
          chmod +x x86_64/libxray.so
          rm -rf /tmp/x86-tmp /tmp/xray-x86.zip

          # Note: armeabi-v7a is not provided by XTLS releases — arm64 covers ~95% of devices.
          echo "Bundled ABIs:"
          ls -lh */libxray.so
      - name: Install Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Generate Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.5
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DISTORT-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/**/*.apk

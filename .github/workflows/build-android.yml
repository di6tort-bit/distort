name: Build DISTORT Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Generate Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 8.5
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DISTORT-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/**/*.apk
